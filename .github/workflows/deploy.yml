name: Build and deploy

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

# Only one deploy at a time; let an in-progress deploy finish rather than cancelling it.
concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            - run: npm run lint

            - run: npm run build

            - uses: actions/upload-pages-artifact@v4
              if: github.event_name != 'pull_request'
              with:
                  path: public

    deploy:
        if: github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
